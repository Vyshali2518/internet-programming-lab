
<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
            background: #f2f6ff;
        }
        h1 { color: navy; }
        input, select, button {
            padding: 10px;
            margin: 8px;
        }
        button {
            background: navy;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Online Bus Ticket Booking</h1>

    <input id="name" placeholder="Passenger Name">
    <br>

    <label>From:</label>
    <select id="from">
        <option>Chennai</option>
        <option>Bangalore</option>
        <option>Hyderabad</option>
    </select>

    <br>

    <label>To:</label>
    <select id="to">
        <option>Bangalore</option>
        <option>Chennai</option>
        <option>Hyderabad</option>
    </select>

    <br>

    <label>Type of Bus:</label>
    <select id="bus">
        <option>AC Sleeper</option>
        <option>Non-AC Sleeper</option>
        <option>AC Seater</option>
        <option>Non-AC Seater</option>
        <option>Volvo Multi-Axle</option>
    </select>

    <br>

    <button onclick="bookTicket()">Book Ticket</button>
    <p id="result"></p>

    <script>
        function bookTicket() {
            let name = document.getElementById("name").value.trim();
            let from = document.getElementById("from").value;
            let to = document.getElementById("to").value;
            let bus = document.getElementById("bus").value;
            let result = document.getElementById("result");

            if (name === "") {
                result.innerHTML = "Enter passenger name.";
            } else if (from === to) {
                result.innerHTML = "Choose different destinations.";
            } else {
                result.innerHTML =
                    "Ticket booked for " + name +
                    "<br>From: " + from +
                    "<br>To: " + to +
                    "<br>Bus Type: " + bus;
            }
        }
    </script>

</body>
</html>
