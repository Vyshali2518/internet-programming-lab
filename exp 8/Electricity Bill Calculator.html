<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f2f6ff
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 8px
        }
    </style>
</head>

<body>

    <h1>Electricity Bill Calculator</h1>

    <input type="number" id="units" placeholder="Enter units used">

    <br>
    <select id="type" title="Consumer Type">
        <option value="domestic">Domestic</option>
        <option value="commercial">Commercial</option>
    </select>

    <br>
    <button onclick="calculate()">Calculate Bill</button>
    <p id="result"></p>

    <script>
        function calculate() {
            let u = Number(document.getElementById("units").value);
            let t = document.getElementById("type").value;

            if (u < 0 || document.getElementById("units").value == "") {
                document.getElementById("result").innerHTML = "Enter valid units";
                return;
            }

            let rate = t == "domestic" ? 1 : 2;
            document.getElementById("result").innerHTML =
                "Units: " + u + "<br>Estimated Bill: ₹" + (u * rate);
        }
    </script>

</body>

</html>
