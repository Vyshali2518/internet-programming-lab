<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Reservation</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f2f6ff
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 8px
        }
    </style>
</head>

<body>

    <h1>Online Flight Reservation</h1>

    <input id="name" placeholder="Passenger Name"><br>

    <label>From:</label>
    <select id="from" title="From City">
        <option>Chennai</option>
        <option>Delhi</option>
        <option>Mumbai</option>
    </select><br>

    <label>To:</label>
    <select id="to" title="To City">
        <option>Delhi</option>
        <option>Chennai</option>
        <option>Mumbai</option>
    </select><br>

    <label>Class:</label>
    <select id="class" title="Travel Class">
        <option>Economy</option>
        <option>Business</option>
        <option>First Class</option>
    </select><br>

    <button onclick="book()">Book Flight</button>
    <p id="result"></p>

    <script>
        function book() {
            let n = document.getElementById("name").value.trim();
            let f = document.getElementById("from").value;
            let t = document.getElementById("to").value;
            let c = document.getElementById("class").value;

            if (n == "") result.innerHTML = "Enter passenger name";
            else if (f == t) result.innerHTML = "Choose different destinations";
            else result.innerHTML = "Flight booked for " + n + "<br>" + f + " to " + t + "<br>Class: " + c;
        }
    </script>
</body>

</html>
