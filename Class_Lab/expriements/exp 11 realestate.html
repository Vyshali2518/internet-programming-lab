<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 11: Real Estate</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Real Estate Home Finder</h1>
    <p>Browse sample homes and request a viewing.</p>
    <h2>Homes for sale</h2>
    <ul><li>City apartment — Chennai</li><li>Family home — Madurai</li><li>Beach house — Pondicherry</li></ul>
    <h2>Request a viewing</h2>
    <form data-message="Your demo viewing request has been sent.">
      <label>Your name <input name="name" required></label>
      <label>Property
        <select name="property" required>
          <option value="">Select a property</option><option>City apartment</option>
          <option>Family home</option><option>Beach house</option>
        </select>
      </label>
      <label>Preferred date <input name="date" type="date" required></label>
      <button type="submit">Request viewing</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
