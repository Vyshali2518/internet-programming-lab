<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 3: Bus Booking</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <main>
    <h1>Online Bus Ticket Booking</h1>
    <p>Select a route and book a sample bus ticket.</p>
    <h2>Popular routes</h2>
    <ul><li>Chennai to Bengaluru</li><li>Chennai to Madurai</li><li>Coimbatore to Chennai</li></ul>
    <h2>Book a ticket</h2>
    <form data-message="Your demo bus ticket has been booked.">
      <label>Passenger name <input name="name" required></label>
      <label>Route
        <select name="route" required>
          <option value="">Select a route</option><option>Chennai to Bengaluru</option>
          <option>Chennai to Madurai</option><option>Coimbatore to Chennai</option>
        </select>
      </label>
      <label>Travel date <input name="date" type="date" required></label>
      <button type="submit">Book ticket</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
