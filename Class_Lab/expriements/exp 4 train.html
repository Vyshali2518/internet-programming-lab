<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 4: Train Reservation</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Online Train Reservation</h1>
    <p>Choose a train and enter your journey details.</p>
    <h2>Available trains</h2>
    <ul><li>Chennai Express</li><li>Vaigai Express</li><li>Pandian Express</li></ul>
    <h2>Reserve a seat</h2>
    <form data-message="Your demo train reservation is complete.">
      <label>Passenger name <input name="name" required></label>
      <label>Train
        <select name="train" required>
          <option value="">Select a train</option><option>Chennai Express</option>
          <option>Vaigai Express</option><option>Pandian Express</option>
        </select>
      </label>
      <label>Journey date <input name="date" type="date" required></label>
      <button type="submit">Reserve seat</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
