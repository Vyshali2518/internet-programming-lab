<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 7: Beauty Parlour</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Beauty Parlour Appointment</h1>
    <p>Choose a service and request an appointment.</p>
    <h2>Services</h2>
    <ul><li>Haircut</li><li>Facial</li><li>Manicure</li></ul>
    <h2>Book an appointment</h2>
    <form data-message="Your demo appointment has been requested.">
      <label>Your name <input name="name" required></label>
      <label>Service
        <select name="service" required>
          <option value="">Select a service</option><option>Haircut</option>
          <option>Facial</option><option>Manicure</option>
        </select>
      </label>
      <label>Appointment date <input name="date" type="date" required></label>
      <button type="submit">Request appointment</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
