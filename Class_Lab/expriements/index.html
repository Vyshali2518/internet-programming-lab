<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A collection of practical service and shopping websites."><title>Everyday Websites</title><link rel="stylesheet" href="css/styles.css"><script src="js/home.js" defer></script><style>
.home-hero{padding:72px max(7vw,24px);background:#f1f5fb;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}.home-hero h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.08;letter-spacing:-2px;margin:12px 0 18px;color:#17233b}.home-hero p{color:#65728a;max-width:590px;line-height:1.8}.home-visual{min-height:240px;border-radius:22px;background:linear-gradient(145deg,#dce8fa,#fff);display:grid;place-items:center;padding:30px}.visual-card{width:min(100%,310px);background:white;border:1px solid #e3e9f2;border-radius:16px;padding:24px;box-shadow:0 18px 45px #1d37661a}.visual-card span{display:block;height:9px;background:#e9eef6;border-radius:8px;margin:13px 0}.visual-card span:nth-child(2){width:70%}.visual-card span:nth-child(3){width:88%}.visual-card b{display:block;width:92px;height:28px;border-radius:7px;background:#3267e8;margin-top:22px}.home-section{padding:52px max(5vw,24px)}.home-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.home-heading h2{margin:0;font-size:28px}.home-heading p{color:#65728a;margin:8px 0 0}.home-search{width:min(100%,360px);padding:13px 15px;border:1px solid #dce3ee;border-radius:10px;background:white}.experiment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.experiment-card{padding:23px;border:1px solid #e3e9f2;background:white;border-radius:15px;transition:transform .18s,box-shadow .18s}.experiment-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #17233b10}.experiment-card .card-number{font-size:12px;color:#3267e8;font-weight:700;letter-spacing:1px}.experiment-card h3{margin:12px 0 8px;font-size:19px}.experiment-card p{font-size:14px;line-height:1.65;color:#65728a;min-height:46px}.card-link{display:inline-block;margin-top:10px;color:#245bd0;font-size:14px;font-weight:700}.site-footer{padding:24px max(5vw,24px);border-top:1px solid #e3e9f2;color:#65728a;font-size:13px}
