<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 2: Hotel Booking</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Hotel Room Booking</h1>
    <p>Choose a room and enter your stay details.</p>
    <h2>Rooms</h2>
    <ul><li>Single room — ₹1,500 per night</li><li>Double room — ₹2,500 per night</li></ul>
    <h2>Book a room</h2>
    <form data-message="Your demo room booking is complete.">
      <label>Your name <input name="name" required></label>
      <label>Room type
        <select name="room" required>
          <option value="">Select a room</option><option>Single room</option><option>Double room</option>
        </select>
      </label>
      <label>Check-in date <input name="date" type="date" required></label>
      <button type="submit">Book room</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
