<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 10: Fashion Shopping</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <main>
    <h1>Fashion Shopping</h1>
    <p>Choose an item and size to place a sample order.</p>
    <h2>Clothing</h2>
    <ul><li>T-shirt — ₹500</li><li>Jeans — ₹1,200</li><li>Jacket — ₹2,000</li></ul>
    <h2>Place an order</h2>
    <form data-message="Your demo fashion order has been placed.">
      <label>Your name <input name="name" required></label>
      <label>Item
        <select name="item" required>
          <option value="">Select an item</option><option>T-shirt</option>
          <option>Jeans</option><option>Jacket</option>
        </select>
      </label>
      <label>Size
        <select name="size" required>
          <option value="">Select a size</option><option>Small</option>
          <option>Medium</option><option>Large</option>
        </select>
      </label>
      <button type="submit">Place order</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
