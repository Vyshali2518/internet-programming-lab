<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 5: Flight Booking</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <main>
    <h1>Online Flight Booking</h1>
    <p>View sample flights and submit a demo booking.</p>
    <h2>Flights</h2>
    <ul><li>Chennai to Mumbai</li><li>Chennai to Delhi</li><li>Bengaluru to Hyderabad</li></ul>
    <h2>Book a flight</h2>
    <form data-message="Your demo flight booking is complete.">
      <label>Passenger name <input name="name" required></label>
      <label>Flight route
        <select name="route" required>
          <option value="">Select a route</option><option>Chennai to Mumbai</option>
          <option>Chennai to Delhi</option><option>Bengaluru to Hyderabad</option>
        </select>
      </label>
      <label>Travel date <input name="date" type="date" required></label>
      <button type="submit">Book flight</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
