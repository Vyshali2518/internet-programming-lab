<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 6: Cake Ordering</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <main>
    <h1>Cake Ordering</h1>
    <p>Choose a cake and enter a delivery date.</p>
    <h2>Our cakes</h2>
    <ul><li>Chocolate cake — ₹600</li><li>Vanilla cake — ₹500</li><li>Black forest cake — ₹750</li></ul>
    <h2>Place an order</h2>
    <form data-message="Your demo cake order has been placed.">
      <label>Your name <input name="name" required></label>
      <label>Cake
        <select name="cake" required>
          <option value="">Select a cake</option><option>Chocolate cake</option>
          <option>Vanilla cake</option><option>Black forest cake</option>
        </select>
      </label>
      <label>Delivery date <input name="date" type="date" required></label>
      <button type="submit">Place order</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
