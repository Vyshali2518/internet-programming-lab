<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 1: Library</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <main>
    <h1>Library Management</h1>
    <p>View a few books and send a simple borrowing request.</p>
    <h2>Available books</h2>
    <ul><li>The Jungle Book</li><li>Wings of Fire</li><li>Treasure Island</li></ul>
    <h2>Borrow a book</h2>
    <form data-message="Your book request has been recorded.">
      <label>Your name <input name="name" required></label>
      <label>Choose a book
        <select name="book" required>
          <option value="">Select a book</option>
          <option>The Jungle Book</option><option>Wings of Fire</option><option>Treasure Island</option>
        </select>
      </label>
      <button type="submit">Request book</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
