<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 9: Electronics Shopping</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Electronics Shopping</h1>
    <p>Browse a few products and try a sample order form.</p>
    <h2>Products</h2>
    <ul><li>Headphones — ₹1,200</li><li>Keyboard — ₹900</li><li>Speaker — ₹1,800</li></ul>
    <h2>Place an order</h2>
    <form data-message="Your demo order has been placed.">
      <label>Your name <input name="name" required></label>
      <label>Product
        <select name="product" required>
          <option value="">Select a product</option><option>Headphones</option>
          <option>Keyboard</option><option>Speaker</option>
        </select>
      </label>
      <label>Quantity <input name="quantity" type="number" min="1" value="1" required></label>
      <button type="submit">Place order</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
