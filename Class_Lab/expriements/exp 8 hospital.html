<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 8: Hospital Appointment</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header><a href="index.html">All experiments</a></header>
  <main>
    <h1>Hospital Appointment</h1>
    <p>Choose a doctor and request a sample appointment.</p>
    <h2>Doctors</h2>
    <ul><li>Dr. Kumar — General Medicine</li><li>Dr. Priya — Pediatrics</li><li>Dr. Ravi — Cardiology</li></ul>
    <h2>Request an appointment</h2>
    <form data-message="Your demo appointment request has been sent.">
      <label>Patient name <input name="name" required></label>
      <label>Doctor
        <select name="doctor" required>
          <option value="">Select a doctor</option><option>Dr. Kumar</option>
          <option>Dr. Priya</option><option>Dr. Ravi</option>
        </select>
      </label>
      <label>Appointment date <input name="date" type="date" required></label>
      <button type="submit">Request appointment</button>
      <p class="message" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
